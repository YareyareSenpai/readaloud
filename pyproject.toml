[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readaloud"
version = "1.1.0"
description = "Terminal ebook reader with multi-backend neural TTS (Edge, Azure, Kokoro, Piper, F5-TTS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["tts", "text-to-speech", "epub", "ebook", "terminal", "curses"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console :: Curses",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "License :: OSI Approved :: MIT License",
]

# Core — always required.  Edge TTS (online) is included; Azure TTS needs no
# extra package (stdlib HTTPS) — just AZURE_SPEECH_KEY / AZURE_SPEECH_REGION
# or ~/.config/readaloud/azure.json.
dependencies = [
    "ebooklib>=0.18",
    "edge-tts>=7.2.8",
    "soundfile>=0.12.0",
]

# Optional engine extras — install what you need:
#   pipx install "readaloud[kokoro]"
#   pipx install "readaloud[piper]"
#   pipx install "readaloud[f5]"
#   pipx install "readaloud[formats]"
#   pipx install "readaloud[all]"
# Kokoro resolves to the native `kokoro` package on Python <3.13 and to
# `pykokoro` (same voices) on 3.13+.  Either needs the spaCy model once:
#   python -m spacy download en_core_web_sm   (inside the readaloud venv)
[project.optional-dependencies]
kokoro = [
    "kokoro>=0.9.4; python_version < '3.13'",
    "pykokoro; python_version >= '3.13'",
    "onnxruntime>=1.16.0",
]
piper = [
    "piper-tts>=1.2.0",
]
f5 = [
    "f5-tts>=1.0.0",
]
formats = [
    "pdfminer.six>=20221105",
    "python-docx>=1.0.0",
    "striprtf>=0.0.26",
    "markdown2>=2.4.0",
]
all = [
    "kokoro>=0.9.4; python_version < '3.13'",
    "pykokoro; python_version >= '3.13'",
    "onnxruntime>=1.16.0",
    "piper-tts>=1.2.0",
    "f5-tts>=1.0.0",
    "pdfminer.six>=20221105",
    "python-docx>=1.0.0",
    "striprtf>=0.0.26",
    "markdown2>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/YareyareSenpai/readaloud"
Issues   = "https://github.com/YareyareSenpai/readaloud/issues"

[project.scripts]
readaloud = "readaloud:main"

[tool.setuptools]
py-modules = ["readaloud"]
